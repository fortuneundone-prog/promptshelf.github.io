<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin - PromptShelf</title>
<style>
:root{--bg:#eef0f3;--ink:#15181e;--mute:#5d6572;--line:#d5d9e0;--acc:#4f46e5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
section{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
h1,h2{margin:0 0 12px}
label{display:block;font-weight:600;margin:12px 0 4px}
input,textarea,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}
textarea{min-height:110px}
button{padding:12px 16px;border:0;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;background:var(--acc);color:#fff;margin-top:14px}
button.alt{background:var(--bg);color:var(--ink)}
button.del{background:#c0392b}
.item{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.item img{width:48px;height:48px;object-fit:cover;border-radius:8px;background:var(--bg)}
.item span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item button{margin:0;padding:8px 12px}
.msg{color:var(--mute);min-height:1.4em;margin-top:8px}
.hint{color:var(--mute);font-size:.9rem}
input:focus-visible,textarea:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<main>
  <h1>PromptShelf admin</h1>

  <section id="login">
    <h2>Sign in</h2>
    <label for="em">Email</label><input id="em" type="email" autocomplete="username">
    <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
    <button id="go">Sign in</button>
    <div class="msg" id="lmsg"></div>
  </section>

  <div id="panel" hidden>
    <section>
      <h2 id="formTitle">Add a prompt</h2>
      <label for="title">Title</label><input id="title">
      <label for="cat">Category</label>
      <select id="cat"><option>Image</option><option>Video</option><option>Text</option></select>
      <label for="prompt">Prompt</label><textarea id="prompt"></textarea>
      <label for="file">Image (upload from your phone)</label><input id="file" type="file" accept="image/*">
      <label for="url">Or image link</label><input id="url" placeholder="https://...">
      <label for="vfile">Video (mp4, max 50 MB)</label><input id="vfile" type="file" accept="video/*">
      <label for="vurl">Or video link (YouTube / Shorts link)</label><input id="vurl" placeholder="https://youtube.com/shorts/...">
      <p class="hint" id="curVid"></p>
      <p class="hint" id="curImg"></p>
      <button id="save">Save prompt</button>
      <button class="alt" id="cancel" hidden>Cancel edit</button>
      <div class="msg" id="msg"></div>
    </section>

    <section>
      <h2>Ad codes</h2>
      <p class="hint">Paste the Adsterra banner code in each box. Leave a box empty to show no ad there.</p>
      <label for="ad_top">Top of page (728x90 or 320x50)</label><textarea id="ad_top"></textarea>
      <label for="ad_inline">Between cards (300x250)</label><textarea id="ad_inline"></textarea>
      <label for="ad_modal">Inside prompt window (300x250)</label><textarea id="ad_modal"></textarea>
      <label for="ad_bottom">Bottom of page (728x90 or 320x50)</label><textarea id="ad_bottom"></textarea>
      <button id="saveAds">Save ad codes</button>
      <div class="msg" id="amsg"></div>
    </section>

    <section>
      <h2>All prompts</h2>
      <div id="list"></div>
    </section>
    <button class="alt" id="out">Sign out</button>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// ====== SAME TWO VALUES AS index.html ======
const SUPABASE_URL = "https://zuutxcmbbtfzftubfubj.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp1dXR4Y21iYnRmemZ0dWJmdWJqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExMDY2MDMsImV4cCI6MjEwNjY4MjYwM30.kkFV2YKGYENL6quq6qbeLtYU0i4n9HnN6XUc68oxNnk";
// ===========================================
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
const ADS = ["ad_top", "ad_inline", "ad_modal", "ad_bottom"];
let editId = null, editImg = "", editVid = "";

async function show(){
  const { data } = await db.auth.getSession();
  const on = !!data.session;
  $("login").hidden = on; $("panel").hidden = !on;
  if (on) { loadList(); loadAds(); }
}
$("go").onclick = async () => {
  $("lmsg").textContent = "Signing in...";
  const { error } = await db.auth.signInWithPassword({ email: $("em").value.trim(), password: $("pw").value });
  if (error) { $("lmsg").textContent = "Sign in failed: " + error.message; return; }
  $("lmsg").textContent = ""; show();
};
$("out").onclick = async () => { await db.auth.signOut(); show(); };

async function loadList(){
  const { data, error } = await db.from("prompts").select("*").order("created_at", { ascending: false });
  const l = $("list"); l.innerHTML = "";
  if (error) { l.textContent = error.message; return; }
  if (!data.length) l.textContent = "No prompts yet. Add your first one above.";
  data.forEach(p => {
    const r = document.createElement("div"); r.className = "item";
    const im = document.createElement("img"); if (p.image_url) im.src = p.image_url;
    const sp = document.createElement("span"); sp.textContent = p.title + " (" + p.category + ")";
    const e = document.createElement("button"); e.className = "alt"; e.textContent = "Edit"; e.onclick = () => startEdit(p);
    const d = document.createElement("button"); d.className = "del"; d.textContent = "Delete";
    d.onclick = async () => {
      if (!confirm("Delete \"" + p.title + "\"?")) return;
      await db.from("prompts").delete().eq("id", p.id); loadList();
    };
    r.append(im, sp, e, d); l.appendChild(r);
  });
}
function startEdit(p){
  editId = p.id; editImg = p.image_url || ""; editVid = p.video_url || "";
  $("formTitle").textContent = "Edit prompt";
  $("title").value = p.title; $("cat").value = p.category; $("prompt").value = p.prompt;
  $("url").value = ""; $("file").value = ""; $("vfile").value = ""; $("vurl").value = "";
  $("curImg").textContent = editImg ? "Current image is kept unless you add a new one." : "";
  $("curVid").textContent = editVid ? "Current video is kept unless you add a new one." : "";
  $("cancel").hidden = false; $("save").textContent = "Save changes";
  window.scrollTo({ top: 0, behavior: "smooth" });
}
function resetForm(){
  editId = null; editImg = ""; editVid = "";
  $("curVid").textContent = "";
  ["title","prompt","url","file","vfile","vurl"].forEach(i => $(i).value = "");
  $("formTitle").textContent = "Add a prompt"; $("curImg").textContent = "";
  $("cancel").hidden = true; $("save").textContent = "Save prompt";
}
$("cancel").onclick = resetForm;

$("save").onclick = async () => {
  const title = $("title").value.trim(), prompt = $("prompt").value.trim();
  if (!title || !prompt) { $("msg").textContent = "Add a title and a prompt first."; return; }
  $("msg").textContent = "Saving...";
  let image_url = $("url").value.trim() || editImg;
  const f = $("file").files[0];
  if (f) {
    const name = Date.now() + "-" + f.name.replace(/[^a-zA-Z0-9.]/g, "_");
    const up = await db.storage.from("images").upload(name, f);
    if (up.error) { $("msg").textContent = "Image upload failed: " + up.error.message; return; }
    image_url = db.storage.from("images").getPublicUrl(name).data.publicUrl;
  }
  let video_url = $("vurl").value.trim() || editVid;
  const vf = $("vfile").files[0];
  if (vf) {
    if (vf.size > 50 * 1024 * 1024) { $("msg").textContent = "Video is over 50 MB. Use a shorter or smaller clip."; return; }
    $("msg").textContent = "Uploading video...";
    const vn = Date.now() + "-" + vf.name.replace(/[^a-zA-Z0-9.]/g, "_");
    const vu = await db.storage.from("images").upload(vn, vf, { contentType: vf.type });
    if (vu.error) { $("msg").textContent = "Video upload failed: " + vu.error.message; return; }
    video_url = db.storage.from("images").getPublicUrl(vn).data.publicUrl;
  }
  const row = { title, prompt, category: $("cat").value, image_url, video_url };
  const res = editId ? await db.from("prompts").update(row).eq("id", editId)
                     : await db.from("prompts").insert(row);
  if (res.error) { $("msg").textContent = "Could not save: " + res.error.message; return; }
  $("msg").textContent = "Saved."; resetForm(); loadList();
};

async function loadAds(){
  const { data } = await db.from("settings").select("*");
  (data || []).forEach(r => { if ($(r.key)) $(r.key).value = r.value; });
}
$("saveAds").onclick = async () => {
  const rows = ADS.map(k => ({ key: k, value: $(k).value }));
  const { error } = await db.from("settings").upsert(rows);
  $("amsg").textContent = error ? "Could not save: " + error.message : "Ad codes saved.";
};
show();
</script>
</body>
</html>
